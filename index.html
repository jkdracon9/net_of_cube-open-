<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="정육면체의 전개도 — 초등학교 5학년 수학 3D 탐구 프로그램 (Nets of a cube: a 3D exploration tool for grade 5)">
  <title>정육면체의 전개도</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3 28 9.5v13L16 29 4 22.5v-13Z' fill='%23fbfbfa' stroke='%2337383c' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='M16 16 28 9.5M16 16v13M16 16 4 9.5' fill='none' stroke='%2337383c' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="workspace" class="workspace">
    <div class="topbar">
      <nav class="modes" role="group" data-i18n-aria="mode.label">
        <button data-mode="make" aria-pressed="false" data-i18n="mode.make">전개도 만들기</button>
        <button data-mode="transform" aria-pressed="false" data-i18n="mode.transform">전개도 바꾸기</button>
      </nav>
      <div id="toolbar" class="toolbar" role="toolbar"></div>
    </div>
    <div id="overlay" class="overlay"></div>
    <div id="tray" class="tray" hidden></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <p id="fatal" class="fatal" role="alert" hidden></p>
  </main>

  <dialog id="settings" class="dialog" aria-labelledby="settings-title">
    <h2 id="settings-title" data-i18n="settings.title">언어</h2>
    <div id="lang-options"></div>
    <div class="row end">
      <button id="close-settings" class="btn primary" data-i18n="settings.close">닫기</button>
    </div>
  </dialog>

  <dialog id="erase" class="dialog" aria-labelledby="erase-title" aria-describedby="erase-text">
    <h2 id="erase-title" data-i18n="erase.title">모두 지울까요?</h2>
    <p id="erase-text" class="dialog-text" data-i18n="erase.warning">지금까지 찾은 전개도와 하던 작업이 모두 사라집니다. 지운 뒤에는 되돌릴 수 없습니다.</p>
    <div class="row end">
      <button id="erase-cancel" class="btn" data-i18n="erase.cancel">취소</button>
      <button id="erase-ok" class="btn danger" data-i18n="erase.confirm">모두 지우기</button>
    </div>
  </dialog>
  <script src="app.bundle.js" defer></script>
</body>
</html>
